name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

  build-backend:
    name: Build Backend
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [lint]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check server
        run: pnpm run forge types server

      - name: Build server
        run: pnpm run forge build server

  build-frontend:
    name: Build Frontend
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [lint]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm run forge build client

  build-summary:
    name: Build Summary
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [lint, build-backend, build-frontend]
    if: always() && github.event_name == 'pull_request'
    timeout-minutes: 3

    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const runId = context.runId;
            const backendResult = '${{ needs.build-backend.result }}';
            const frontendResult = '${{ needs.build-frontend.result }}';
            const lintResult = '${{ needs.lint.result }}';

            let summary = '## 🔨 Build Results\n\n';
            let allSuccess = true;

            // Lint & typecheck status
            if (lintResult === 'success') {
              summary += '✅ **Lint & Typecheck**: Passed\n';
            } else {
              summary += `❌ **Lint & Typecheck**: Failed (${lintResult})\n`;
              allSuccess = false;
            }

            // Backend status
            if (backendResult === 'success') {
              summary += '✅ **Backend Build**: Passed\n';
            } else {
              summary += `❌ **Backend Build**: Failed (${backendResult})\n`;
              allSuccess = false;
            }

            // Frontend status  
            if (frontendResult === 'success') {
              summary += '✅ **Frontend Build**: Passed\n';
            } else {
              summary += `❌ **Frontend Build**: Failed (${frontendResult})\n`;
              allSuccess = false;
            }

            summary += '\n';

            if (allSuccess) {
              summary += '🎉 All builds completed successfully!';
            } else {
              summary += '⚠️ One or more builds failed. Please check the logs for details.';
            }

            summary += `\n\n🔗 [View full workflow run](https://github.com/${owner}/${repo}/actions/runs/${runId})`;

            // Find existing comment to update
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });

            const botComment = comments.data.find(
              comment => comment.user.type === 'Bot' && 
              comment.body.includes('## 🔨 Build Results')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: summary
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: summary
              });
            }
