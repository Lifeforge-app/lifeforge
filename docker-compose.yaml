# LifeForge – local development compose
# Default host ports match the commander's existing local instance:
#   PocketBase :8090
#   API server :3636
#   Web client :5173
# Alternate host ports can be selected with PB_PORT, API_PORT, and WEB_PORT.
#
# Usage:
#   cp env/.env.docker.example env/.env.docker   # edit credentials
#   docker compose up --build
#   docker compose down -v                         # tear down + volumes
#
# Stop any manually-started PocketBase / API / dev-server before using these
# ports; an old manually-started PocketBase conflicts on port 8090.

services:
  # ── PocketBase database ──────────────────────────────────────────────
  db:
    build:
      context: .
      dockerfile: docker/pocketbase/Dockerfile
    container_name: lifeforge-db
    restart: unless-stopped
    env_file:
      - ./env/.env.docker
    environment:
      - PB_DIR=/pb_data
    ports:
      - '${PB_PORT:-8090}:8090'
    volumes:
      - pb_data:/pb_data

  # ── One-shot migration runner ────────────────────────────────────────
  db-init:
    build:
      context: .
      dockerfile: docker/db-init/Dockerfile
    container_name: lifeforge-db-init
    env_file:
      - ./env/.env.docker
    environment:
      - DOCKER_MODE=true
      - PB_HOST=http://localhost:8090
      - PB_DIR=/pb_data
    volumes:
      - pb_data:/pb_data
      - ./modules:/app/modules
    depends_on:
      db:
        condition: service_healthy
    # exits after migrations are applied

  # ── API server ───────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    container_name: lifeforge-server
    restart: unless-stopped
    env_file:
      - ./env/.env.docker
    environment:
      - NODE_ENV=production
      - PB_HOST=http://db:8090
      - PORT=3636
      - TRUST_PROXY=1
    ports:
      - '${API_PORT:-3636}:3636'
    volumes:
      - ./locales:/lifeforge/locales
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # ── Web client (nginx SPA) ───────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
      args:
        - VITE_API_HOST=/api
    container_name: lifeforge-client
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-5173}:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  pb_data:
    name: lifeforge-pb-data
